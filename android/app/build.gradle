plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}
android {
    def keystoreProperties = new Properties()
    def keystorePropertiesFile = rootProject.file('key.properties')
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }
    // Consider keystore present only if storeFile is defined
    def hasReleaseKeystore = keystoreProperties.containsKey('storeFile') && keystoreProperties['storeFile']

    namespace "dev.suragch.flutter_audio_service_demo"  // Your package name
    compileSdkVersion 35

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "dev.suragch.flutter_audio_service_demo"  // Your package name
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 35
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            // If a release keystore is configured, use it; otherwise fall back to debug signing
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else {
                println 'WARNING: No key.properties configured for release. Falling back to debug signing for release build.'
                signingConfig signingConfigs.debug
            }
        }
    }
}

flutter {
    source '../..'
}
