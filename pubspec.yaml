name: flutter_audio_service_demo
description: Companion project for tutorial on audio_service plugin.
publish_to: 'none'

version: 4.0.3+22

environment:
  sdk: ">=3.3.0 <4.0.0"

dependency_overrides:
  interval_tree: ^0.4.1

dependencies:
  platform: ^3.1.0 
  flutter:
    sdk: flutter
  
  flutter_launcher_icons: ^0.14.3
  get_it: ^8.0.3
  just_audio: ^0.9.27
  #just_audio_libwinmedia: ^0.0.4+1
  just_audio_windows: ^0.2.2
  audio_service: ^0.18.6
  path_provider: ^2.0.0
  url_launcher: ^6.1.2
  in_app_review: ^2.0.8
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.0.0
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  sqlite3_flutter_libs: ^0.5.24
  dio: ^5.7.0
  path: ^1.9.0
  crypto: ^3.0.3
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.2.2
  uuid: ^4.5.1
  package_info_plus: ^8.3.0
  flutter_localizations:
    sdk: flutter
  flutter_dotenv: ^5.1.0
  connectivity_plus: ^6.1.1
dev_dependencies:
  flutter_lints: ^3.0.2
  flutter_test:
    sdk: flutter
  

flutter:
  uses-material-design: true
  assets:
    - .env
    - images/logo.png
    - images/logo_without_text.png
    - images/harmonium_background.png
    - images/default_profile.png
    - images/upi_qr.png
    - images/do_taal.png
    - images/teen_taal.png
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf


flutter_icons:
  android: true
  ios: true
  macos: true
  image_path: "images/appicon.png"
  adaptive_icon_foreground: "images/appicon.png"    
