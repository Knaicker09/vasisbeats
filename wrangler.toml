name = "vasis-beats-web"
compatibility_date = "2026-09-25"

# Static Flutter web build output. No Workers Functions -- this is a plain
# static site, so no [functions]/build config beyond the output dir is
# needed. Used by:
#   - `wrangler pages deploy build/web` for a manual/CLI deploy
#   - `wrangler pages dev build/web` to preview the built output locally
# The Cloudflare Pages dashboard's Git integration (build command below,
# configured in the project's Settings) does the actual build; this file
# doesn't drive that build, only local `wrangler` CLI usage.
pages_build_output_dir = "build/web"
